name: Build downloads

# Push a tag like v1.0.0 to build the Windows .exe and Mac app and attach them to a GitHub Release.
# You can also run it by hand from the Actions tab (workflow_dispatch) to just test the build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build .exe
        run: |
          pip install -r requirements-windows.txt pyinstaller
          pyinstaller --noconsole --onefile --name GeminiSnap-Windows --hidden-import pystray._win32 --hidden-import mss.windows gemini_snap_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/GeminiSnap-Windows.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GeminiSnap-Windows.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build .app
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --windowed --name GeminiSnap --osx-bundle-identifier com.geminisnap.app \
            --hidden-import AppKit --hidden-import Foundation --hidden-import Quartz \
            --hidden-import PyObjCTools.AppHelper gemini_snap.py
          # menu-bar-only app: no Dock icon
          /usr/libexec/PlistBuddy -c "Add :LSUIElement bool true" dist/GeminiSnap.app/Contents/Info.plist
          codesign --force --deep -s - dist/GeminiSnap.app
          ditto -c -k --keepParent dist/GeminiSnap.app GeminiSnap-Mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: GeminiSnap-Mac.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GeminiSnap-Mac.zip
